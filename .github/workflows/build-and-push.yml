name: Portainer-GenX CI/CD

on:
  push:
    branches: [ "develop" ]
    tags:
      - '*-genx'
      - 'v*-genx'
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Step 2: Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    # Step 3: Set up pnpm
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.26.2
        
    # Step 4: Set up Go
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    # Step 5: Set up Docker metadata (for tags)
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/portainer-genx
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    # Step 6: Install dependencies and build
    - name: Build Portainer
      run: pnpm install --no-frozen-lockfile && make all
      env:
        ENV: production

    # Step 7: Build the Docker image
    - name: Build Docker Image
      run: docker build -f build/linux/Dockerfile -t portainer-genx:local .

    # Step 8: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    # Step 9: List Docker images (for debugging)
    - name: List Docker Images
      run: docker images
      
    # Step 10: Tag and Push the Docker Image
    - name: Tag and Push Docker Image
      run: |
        # Always tag as latest on develop branch
        docker tag portainer-genx:local ${{ secrets.DOCKER_USERNAME }}/portainer-genx:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/portainer-genx:latest
        
        # If this is a tag push, also tag with version number
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG_NAME="${{ github.ref_name }}"
          echo "Tagging with version: $TAG_NAME"
          docker tag portainer-genx:local ${{ secrets.DOCKER_USERNAME }}/portainer-genx:$TAG_NAME
          docker push ${{ secrets.DOCKER_USERNAME }}/portainer-genx:$TAG_NAME
        fi
